name: Validate and build Canvas pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'canvas/**'
      - 'course-map.json'
      - 'scripts/**'
      - '.github/workflows/build-canvas-package.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and build actual course pages
        run: python scripts/canvas_workflow.py build .
      - uses: actions/upload-artifact@v4
        with:
          name: Canvas-page-package-and-validation
          path: |
            dist/*.imscc
            reports/validation.json
          if-no-files-found: error
